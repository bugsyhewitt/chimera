# CHIMERA P04 — Cowrie SSH honeypot config override.
# Mounted read-only at /cowrie/cowrie-git/etc/cowrie.cfg.
# Only pins the settings P04 cares about; everything else falls back to the
# packaged cowrie.cfg.dist defaults.

[honeypot]
hostname = svr04
log_path = var/log/cowrie
download_path = ${honeypot:state_path}/downloads
state_path = var/lib/cowrie

[ssh]
enabled = true
# Inside the container Cowrie listens on 2222; compose maps host
# 127.0.0.1:2222 -> container 2222. Bind 0.0.0.0 inside the container so the
# Docker port-forward (which arrives via the bridge, not loopback) reaches it.
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# Telnet honeypot not needed for P04; keep it off to minimise surface.
enabled = false

# ---- JSON logging (P04 requirement; on by default, pinned here) ----
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
