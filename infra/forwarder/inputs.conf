# CHIMERA P06 — Universal Forwarder inputs
# Monitors the host Docker named-volume _data paths for the three honeypot/sensor
# log streams and routes them to the correct indexes/sourcetypes.
#
# JSON parsing: INDEXED_EXTRACTIONS=json is set per-source (and mirrored in props on
# the indexer is unnecessary — INDEXED_EXTRACTIONS extracts fields at index time on
# the forwarder). This makes top-level JSON fields (src_ip, username, password,
# eventid, ...) directly queryable without search-time KV config.
#
# NOTE: splunkd runs as root so it can read /var/lib/docker/volumes (mode 700 root).

[monitor:///var/lib/docker/volumes/chimera_cowrie_logs/_data/cowrie.json]
disabled = false
index = idx_honeypot
sourcetype = cowrie:json

[monitor:///var/lib/docker/volumes/chimera_galah_logs/_data/galah.json]
disabled = false
index = idx_honeypot
sourcetype = galah:json

[monitor:///var/lib/docker/volumes/chimera_beelzebub_logs/_data/beelzebub.json]
disabled = false
index = idx_honeypot
sourcetype = beelzebub:json

[monitor:///var/lib/docker/volumes/chimera_suricata_logs/_data/eve.json]
disabled = false
index = idx_network
sourcetype = suricata:eve

# JSON structured extraction is configured in the matching props.conf
# (etc/system/local/props.conf, also tracked at infra/forwarder/props.conf)
# via INDEXED_EXTRACTIONS = json per sourcetype.
