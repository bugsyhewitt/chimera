# CHIMERA P06 — Universal Forwarder props
# Structured (index-time) JSON field extraction for the honeypot/sensor sourcetypes.
# INDEXED_EXTRACTIONS=json makes top-level JSON keys (src_ip, username, password,
# eventid, timestamp, ...) directly queryable without search-time KV.
# TIMESTAMP_FIELDS uses the JSON timestamp field where present.

[cowrie:json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = timestamp
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%Z
category = Structured
disabled = false

[galah:json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
category = Structured
disabled = false

[suricata:eve]
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = timestamp
category = Structured
disabled = false

# CHIMERA P10a — Beelzebub MCP decoy. logrus JSONFormatter output, one object per
# line. MCP tool invocations carry msg="New Event" with the details nested under
# the `event` object (event.Protocol=MCP, event.Command="tool:<name>|<args>",
# event.Msg="New MCP tool invocation"). INDEXED_EXTRACTIONS=json flattens these to
# dotted fields (event.Protocol, event.Command, ...). TIMESTAMP_FIELDS=time uses
# logrus's RFC3339 `time` key.
[beelzebub:json]
INDEXED_EXTRACTIONS = json
KV_MODE = none
TIMESTAMP_FIELDS = time
category = Structured
disabled = false
