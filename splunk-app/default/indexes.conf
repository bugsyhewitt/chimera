# CHIMERA indexes. Three logical planes:
#   idx_network   — sensor data (Suricata eve.json, Zeek metadata)
#   idx_honeypot  — Cowrie / Galah / Beelzebub session logs
#   idx_deception — CHIMERA's own decision + engagement log (orchestrator write-back)

[idx_network]
homePath   = $SPLUNK_DB/idx_network/db
coldPath   = $SPLUNK_DB/idx_network/colddb
thawedPath = $SPLUNK_DB/idx_network/thaweddb
frozenTimePeriodInSecs = 7776000

[idx_honeypot]
homePath   = $SPLUNK_DB/idx_honeypot/db
coldPath   = $SPLUNK_DB/idx_honeypot/colddb
thawedPath = $SPLUNK_DB/idx_honeypot/thaweddb
frozenTimePeriodInSecs = 7776000

[idx_deception]
homePath   = $SPLUNK_DB/idx_deception/db
coldPath   = $SPLUNK_DB/idx_deception/colddb
thawedPath = $SPLUNK_DB/idx_deception/thaweddb
frozenTimePeriodInSecs = 7776000
