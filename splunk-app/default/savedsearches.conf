# CHIMERA saved searches — Tier-3 metrics (P15)
# Owned by the dashboard-builder packet. These back the chimera_metrics dashboard
# and provide reusable, named outcome metrics for the demo.

[CHIMERA - Money Chart - Dwell WITH vs WITHOUT]
search = index=idx_deception type=session_summary synthetic=true scenario IN (baseline_static_honeypot,chimera_adaptive) \
| eval cohort=case(scenario=="chimera_adaptive","WITH CHIMERA",scenario=="baseline_static_honeypot","WITHOUT (static honeypot)",true(),scenario) \
| stats avg(dwell_seconds) as avg_dwell_seconds max(dwell_seconds) as max_dwell_seconds count as sessions sum(penetration_escaped) as sessions_escaped by cohort \
| eval avg_dwell_seconds=round(avg_dwell_seconds,1) \
| sort - avg_dwell_seconds
dispatch.earliest_time = -25h
dispatch.latest_time = now
description = Headline demo metric: average attacker dwell time WITH CHIMERA (adaptive breadcrumbs) vs WITHOUT (static honeypot baseline). Synthetic, clearly-labeled demo cohorts.
request.ui_dispatch_app = chimera

[CHIMERA - Penetration Probability]
search = index=idx_deception type=session_summary \
| eval escaped=if(isnull(penetration_escaped),0,penetration_escaped) \
| stats sum(escaped) as sessions_escaped count as total_sessions \
| eval penetration_probability_pct=round(if(total_sessions=0,0,sessions_escaped/total_sessions)*100,2)
dispatch.earliest_time = -25h
dispatch.latest_time = now
description = Fraction of sessions that escalated past honeypot containment (escaped). ~0 by architecture - routed attackers remain inside the deception layer.
request.ui_dispatch_app = chimera

[CHIMERA - Live Belief State]
search = index=idx_deception type=deception_action \
| eval et=if(isnull(ts),_time,ts) \
| sort 0 - et \
| dedup session \
| eval p_benign=round('belief.benign',3), p_human=round('belief.human',3), p_ai=round('belief.ai',3) \
| table _time src_ip session action p_benign p_human p_ai scenario
dispatch.earliest_time = -25h
dispatch.latest_time = now
description = Latest POMDP belief vector and chosen breadcrumb-intensity action per session.
request.ui_dispatch_app = chimera
